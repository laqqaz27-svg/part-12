
services:
  frontend:
    build:
      context: ../../../blog-pipeline
      dockerfile: ../Part 12/fs-containers/my-app/frontend/Dockerfile
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    build:
      context: ../../../blog-pipeline
      dockerfile: ../Part 12/fs-containers/my-app/backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3003"
      MONGODB_URI: mongodb://mongo:27017/bloglist
      SECRET: ${BLOG_SECRET:?Set BLOG_SECRET in your environment}
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
