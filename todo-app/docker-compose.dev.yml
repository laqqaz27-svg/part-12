
services:
  app:
    image: todo-frontend-dev
    volumes:
      - ./todo-frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - 5173:5173
    environment:
      - VITE_BACKEND_URL=/api
    container_name: todo-frontend-dev

  server:
    image: todo-backend-dev
    ports:
      - 3000:3000
    environment:
      - REDIS_URL=redis://todo-backend-redis-1:6379
      - MONGO_URL=mongodb://the_username:the_password@todo-backend-mongo-1:27017/the_database?authSource=the_database
    networks:
      - default
      - todo-backend_default
    container_name: todo-backend-server-1

  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: todo-app-reverse-proxy
    depends_on:
      - app
      - server

networks:
  todo-backend_default:
    external: true
